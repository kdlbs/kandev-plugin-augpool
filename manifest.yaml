id: "kandev-augpool"
api_version: 1
version: "0.1.1"
display_name: "Augpool"
description: "View Augpool account usage, routing health, and trusted-host account controls from Kandev."
author: "kdlbs"
categories: ["analytics", "tools"]
repo_url: "https://github.com/kdlbs/kandev-plugin-augpool"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

webhooks:
  - key: "stats"
    description: "Return Augpool CLI health and the credential-free account stats snapshot."
    method: "GET"
  - key: "action"
    description: "Run an explicitly enabled Augpool CLI account action."
    method: "POST"

ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]

config_schema:
  type: object
  properties:
    augpool_executable:
      type: string
      title: "Augpool executable"
      description: "Optional exact executable path. Empty checks the Kandev process PATH, ~/.local/bin, and standard Homebrew locations."
      default: ""
    augpool_home:
      type: string
      title: "Augpool home"
      description: "Optional Augpool home passed as --home. Empty uses Augpool's normal AUGPOOL_HOME or ~/.augpool resolution."
      default: ""
    management_enabled:
      type: boolean
      title: "Enable account controls and export"
      description: "Off by default. Enable only on a trusted single-user loopback/private Kandev host; reachable clients can mutate accounts and export full credentials."
      default: false
